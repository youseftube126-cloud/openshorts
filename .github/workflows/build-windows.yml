name: Build Windows installer

on:
  workflow_dispatch:      # run it by hand from the Actions tab

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build dashboard
        shell: pwsh
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - name: Stage app files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\OpenShorts\app | Out-Null
          robocopy . dist\OpenShorts\app /E /XD .git .github node_modules dist installer output uploads tests screenshots osrender render-service __pycache__ /XF *.mp4 *.gif /NFL /NDL /NJH /NJS | Out-Null
          # the dashboard build output lives in dashboard\dist: copy it back (robocopy skipped every "dist")
          New-Item -ItemType Directory -Force dist\OpenShorts\app\dashboard\dist | Out-Null
          Copy-Item -Recurse -Force dashboard\dist\* dist\OpenShorts\app\dashboard\dist\
          exit 0

      - name: Embedded Python + dependencies
        shell: pwsh
        run: |
          $py = "dist\OpenShorts\python"
          New-Item -ItemType Directory -Force $py | Out-Null
          Invoke-WebRequest https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip -OutFile py.zip
          Expand-Archive py.zip $py
          # Let the embedded interpreter see site-packages and the app folder.
          @"
          python311.zip
          .
          Lib\site-packages
          ..\app
          import site
          "@ | Set-Content "$py\python311._pth"
          Invoke-WebRequest https://bootstrap.pypa.io/get-pip.py -OutFile get-pip.py
          & "$py\python.exe" get-pip.py --no-warn-script-location
          # CPU torch first (the default wheel drags in GBs of CUDA), then the rest.
          & "$py\python.exe" -m pip install --no-warn-script-location --index-url https://download.pytorch.org/whl/cpu torch==2.11.0 torchvision==0.26.0
          & "$py\python.exe" -m pip install --no-warn-script-location -r requirements.txt

      - name: Bundle FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip ffmpeg-tmp
          New-Item -ItemType Directory -Force dist\OpenShorts\ffmpeg | Out-Null
          Copy-Item ffmpeg-tmp\*\bin\*.exe dist\OpenShorts\ffmpeg\

      - name: Smoke test (backend imports and starts)
        shell: pwsh
        run: |
          $env:PATH = "$PWD\dist\OpenShorts\ffmpeg;$env:PATH"
          Set-Location dist\OpenShorts\app
          & ..\python\python.exe -c "import app; print('app imported OK')"

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" desktop\openshorts.iss

      - uses: actions/upload-artifact@v4
        with:
          name: OpenShorts-Studio-Setup
          path: installer\OpenShorts-Studio-Setup.exe
